<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jonbildning</title>
<link rel="stylesheet" href="kemi.css"></head><body><div class="app">

<h1>🧂 Jonbildning</h1>
<p class="lead">Välj en metall och en icke-metall. Förutsäg hur många elektroner som flyttas och se hur jonföreningen bildas.</p>
<div class="panel" style="margin-bottom:14px">
  <div class="row" style="align-items:center">
    <label>Metall: <select id="m"></select></label>
    <label>Icke-metall: <select id="nm"></select></label>
  </div>
</div>
<div class="row">
  <div class="panel grow"><svg id="svg" viewBox="0 0 600 300"></svg><div class="legend"><span><i style="background:#5ecfa0"></i>inre skal</span><span><i style="background:#5ab0e8"></i>valenselektroner</span></div></div>
  <div class="panel grow" style="flex-basis:280px">
    <div class="label">Steg för steg</div>
    <div id="q1"></div><div id="q2" style="margin-top:12px"></div>
    <div style="margin-top:14px"><button class="primary" id="go" disabled>Överför elektroner →</button> <button id="back" style="display:none">Börja om</button></div>
    <div class="msg info" id="msg" style="display:none"></div>
  </div>
</div><script src="kemi.js"></script><script>

const metals=["Li","Na","K","Mg","Ca","Al"], nons=["F","Cl","O","S","N"];
const ide={F:"fluorid",Cl:"klorid",O:"oxid",S:"sulfid",N:"nitrid"};
const msel=$("m"),nsel=$("nm");
metals.forEach(s=>msel.add(new Option(bySym(s).name+" ("+s+")",s)));
nons.forEach(s=>nsel.add(new Option(bySym(s).name+" ("+s+")",s)));
msel.value="Na";nsel.value="Cl";
const val=el=>shells(el.z).pop();
const gcd=(a,b)=>b?gcd(b,a%b):a;
let ok1=false,ok2=false,done=false;
function subs(n){return n>1?"<sub>"+n+"</sub>":""}
function choices(id,txt,right,opts,cb){
  const box=$(id);box.innerHTML="<div style=\"margin-bottom:6px\">"+txt+"</div>";
  opts.forEach(o=>{const b=document.createElement("button");b.textContent=o;b.style.marginRight="6px";
    b.onclick=()=>{if(b.classList.contains("good"))return;
      if(o===right){b.className="good";box.querySelectorAll("button").forEach(x=>x.disabled=true);cb(true)}else{b.className="bad"}};
    box.appendChild(b);});
}
function reset(){
  const M=bySym(msel.value),N=bySym(nsel.value);
  done=false;ok1=ok2=false;$("go").disabled=true;$("back").style.display="none";$("msg").style.display="none";$("go").style.display="";
  $("q2").innerHTML="";
  const vm=val(M),need=8-val(N);
  choices("q1",`<b>${M.name}</b> har ${vm} valenselektron${vm>1?"er":""}. Hur många elektroner lämnar den ifrån sig för att få fullt yttre skal?`,String(vm),["1","2","3","4"],()=>{
    ok1=true;
    choices("q2",`<b>${N.name}</b> har ${val(N)} valenselektroner. Hur många elektroner behöver <b>en</b> atom ta upp för att få fullt skal?`,String(need),["1","2","3","4"],()=>{ok2=true;$("go").disabled=false});
  });
  draw(false);
}
function draw(after){
  const M=bySym(msel.value),N=bySym(nsel.value),vm=val(M),need=8-val(N);
  const L=vm*need/gcd(vm,need),a=L/vm,b=L/need;
  const svg=$("svg");svg.innerHTML="";
  const em=after?M.z-vm:M.z, en=after?N.z+need:N.z;
  drawAtom(svg,{p:M.z,n:M.mass-M.z,e:em,cx:150,cy:140,scale:.9,maxShells:shells(M.z).length,label:M.sym+(after?charge(vm):"")+(a>1?"  × "+a:"")});
  drawAtom(svg,{p:N.z,n:N.mass-N.z,e:en,cx:450,cy:140,scale:.9,maxShells:shells(N.z).length,label:N.sym+(after?charge(-need):"")+(b>1?"  × "+b:"")});
  const t=document.createElementNS("http://www.w3.org/2000/svg","text");
  t.setAttribute("x",300);t.setAttribute("y",after?290:150);t.setAttribute("text-anchor","middle");t.setAttribute("font-size",after?15:26);t.setAttribute("fill",after?"#5ecfa0":"#8d9bbb");
  t.textContent=after?"⟵ "+L+" e⁻ flyttade":"+";svg.appendChild(t);
  return {M,N,vm,need,a,b};
}
$("go").onclick=()=>{
  const r=draw(true);done=true;$("go").style.display="none";$("back").style.display="";
  const f=r.M.sym+(r.a>1?"<sub>"+r.a+"</sub>":"")+r.N.sym+(r.b>1?"<sub>"+r.b+"</sub>":"");
  const m=$("msg");m.style.display="";m.className="msg good";
  m.innerHTML=`${r.M.name} lämnar ifrån sig ${r.vm} e⁻ och blir <b>${r.M.sym}${charge(r.vm)}</b>. ${r.N.name} tar upp ${r.need} e⁻ och blir <b>${r.N.sym}${charge(-r.need)}</b>.<br>`+
  (r.a>1||r.b>1?`Det behövs ${r.a} ${r.M.sym}-atom${r.a>1?"er":""} och ${r.b} ${r.N.sym}-atom${r.b>1?"er":""} så att laddningarna tar ut varandra (${r.a*r.vm} + och ${r.b*r.need} −).<br>`:"Laddningarna tar ut varandra.<br>")+
  `Jonerna dras till varandra med elektriska krafter (jonbindning). Formel: <b>${f}</b> – ${r.M.name.toLowerCase()}${ide[r.N.sym]}.`;
};
$("back").onclick=reset;msel.onchange=reset;nsel.onchange=reset;
reset();
</script></body></html>
